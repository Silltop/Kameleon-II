<!DOCTYPE html>
<html lang="en" id="html-root" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kameleon - {% block title %}{% endblock %}</title>
    <meta http-equiv="Access-Control-Allow-Methods"
      content="GET, POST, PUT, DELETE, OPTIONS" />
    <meta http-equiv="Access-Control-Allow-Headers"
      content="Content-Type, Authorization" />
    <link rel="stylesheet"
      href="{{ url_for('static', filename='dist/css/src.css') }}">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='dist/css/anim.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}"
      type="image/x-icon" />
    <script type="module"
      src="{{ url_for('static', filename='dist/js/toast.js') }}"></script>
  </head>
  <body>
    <div class="page-wrapper flex flex-col min-h-screen">

      {% include 'toast.html' %}
      {% include 'navbar.html' %}

      <main class="content-wrapper flex-1">
        {% block content %}

        {% endblock %}
      </main>

      {% include 'footer.html' %}
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>

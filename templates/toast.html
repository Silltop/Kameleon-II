<!-- Toast container - managed by Preact ToastManager component -->
<div id="toast-container"></div>

<!-- Display Flask flash messages via window.showToast API -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Give toast system a moment to initialize
    setTimeout(function() {
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
          if (window.showToast) {
            window.showToast('{{ message }}', 'info', 7500);
          }
          {% endfor %}
        {% endif %}
      {% endwith %}
    }, 100);
  });
</script>

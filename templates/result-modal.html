<div class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 modal-overlay"
  id="result-modal" tabindex="-1" role="dialog">
  <div class="flex items-center justify-center min-h-screen">
    <div
      class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-md w-full m-4"
      role="document">
      <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <h5
          class="text-lg font-semibold text-gray-900 dark:text-white">Execution
          Status</h5>
      </div>
      <div class="px-6 py-4 max-h-96 overflow-y-auto">
        {% for host, status, status_details in results %}
        <div class="mb-4">
          <div class="font-medium text-gray-900 dark:text-gray-100">{{host}}
            status:
            {% if status.lower() == 'ok' %}
            <span
              class="text-green-600 dark:text-green-400 font-semibold">{{status}}</span>
            {% else %}
            <span
              class="text-red-600 dark:text-red-400 font-semibold">{{status}}</span>
            {% endif %}
          </div>
          <p
            class="text-gray-600 dark:text-gray-400 text-xs mt-1">{{status_details}}</p>
        </div>
        <hr class="border-gray-200 dark:border-gray-700">
        {% endfor %}
      </div>
      <div
        class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 text-right">
        <button
          class="px-4 py-2 bg-gray-600 hover:bg-gray-700 dark:bg-gray-700 dark:hover:bg-gray-600 text-white rounded-md transition-colors"
          onclick="toggleModal('result-modal')" role="button">Close</button>
      </div>
    </div>
  </div>
</div>
<script>
function toggleModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.toggle('hidden');
  }
}
</script>

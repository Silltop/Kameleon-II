{% extends "base.html" %}
{% block title %}Directadmin suspended users{% endblock %}
{% block content %}
<div class="px-6 py-6">
  <div class="flex gap-4 mb-6 items-end">
    <div class="flex-1">
      <label class="block text-sm font-semibold mb-2">View data from:</label>
      <select id="snapshot-select"
        class="select select-bordered w-full max-w-xs">
        <option value="current">Current Data</option>
      </select>
    </div>
    <button id="refresh-btn" class="btn btn-primary gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
      Refresh
    </button>
  </div>

  <div
    class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100"
    id="record-container">
    <table class="table">
      <thead>
        <tr>
          <th>Host</th>
          <th>User</th>
          <th>Days ago</th>
        </tr>
      </thead>
      <tbody>
        {% for host, host_data in data.items() %}
        {% for user, time in host_data.items() %}
        <tr>
          <th>{{host}}</th>
          <td>{{user}}</td>
          <td>{{time}} days ago</td>
        </tr>
        {% endfor %}
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<script>
  let currentData = {{ data | tojson }};

  const snapshotSelect = document.getElementById('snapshot-select');
  const refreshBtn = document.getElementById('refresh-btn');
  const recordContainer = document.getElementById('record-container');

  async function loadSnapshots() {
    try {
      // Clear existing snapshot options (keep only 'Current Data')
      Array.from(snapshotSelect.options).forEach((option, index) => {
        if (index > 0) option.remove();
      });

      const response = await fetch('/da/api/suspended-users-snapshots');
      const snapshots = await response.json();

      snapshots.forEach((snapshot) => {
        const option = document.createElement('option');
        option.value = snapshot.id;
        option.textContent = snapshot.display;
        snapshotSelect.appendChild(option);
      });
    } catch (error) {
      console.error('Error loading snapshots:', error);
    }
  }

  snapshotSelect.addEventListener('change', async (e) => {
    if (e.target.value === 'current') {
      renderData(currentData);
      return;
    }

    try {
      const response = await fetch(`/da/api/suspended-users-snapshot/${e.target.value}`);
      const result = await response.json();
      if (result.data) {
        renderData(result.data);
      }
    } catch (error) {
      console.error('Error loading snapshot:', error);
      window.showToast?.error?.('Failed to load snapshot');
    }
  });

  refreshBtn.addEventListener('click', async () => {
    refreshBtn.disabled = true;
    try {
      const response = await fetch('/da/api/refresh-suspended-users-snapshot');
      const result = await response.json();

      if (result.status === 'success') {
        window.showToast?.success?.('Data refreshed successfully');
        location.reload();
      }
    } catch (error) {
      console.error('Error refreshing data:', error);
      window.showToast?.error?.('Failed to refresh data');
    } finally {
      refreshBtn.disabled = false;
    }
  });

  function renderData(data) {
    let html = '<thead><tr><th>Host</th><th>User</th><th>Days ago</th></tr></thead><tbody>';

    for (const [host, hostData] of Object.entries(data)) {
      for (const [user, time] of Object.entries(hostData)) {
        html += `<tr><th>${host}</th><td>${user}</td><td>${time} days ago</td></tr>`;
      }
    }

    html += '</tbody>';
    recordContainer.innerHTML = `<table class="table">${html}</table>`;
  }

  loadSnapshots();
</script>
{% endblock %}
